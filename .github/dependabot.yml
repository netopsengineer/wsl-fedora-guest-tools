# Dependabot keeps pinned automation and local quality tooling current.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    versioning-strategy: increase
    groups:
      npm-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - pre-commit
    open-pull-requests-limit: 5
