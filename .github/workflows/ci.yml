---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday run at 07:13 UTC to catch upstream breakage economically.
    - cron: "13 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOCACHE: /tmp/go-build
      PREK_HOME: /tmp/prek
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install tooling
        run: npm ci --ignore-scripts --loglevel=error

      - name: Run static quality hooks
        run: npm run lint

      - name: AGENTS.md size check
        run: '[[ $(wc -c < AGENTS.md) -le 32768 ]] || { echo "AGENTS.md exceeds 32 KiB: $(wc -c < AGENTS.md) bytes"; exit 1; }'

  fedora_smoke:
    name: fedora-smoke (${{ matrix.fedora_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora_image: "fedora:43"
            fedora_label: fedora43
          - fedora_image: "fedora:42"
            fedora_label: fedora42
    container:
      image: ${{ matrix.fedora_image }}
    timeout-minutes: 10

    steps:
      - name: Install smoke dependencies
        run: dnf install -y git sudo util-linux

      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Smoke checks
        run: |
          expect_success_or_exit_10() {
            local log_file
            local status

            log_file="$(mktemp)"
            if "$@" >"$log_file" 2>&1; then
              rm -f "$log_file"
              return 0
            fi

            status=$?
            if [[ "$status" -eq 10 ]]; then
              rm -f "$log_file"
              return 0
            fi

            cat "$log_file"
            rm -f "$log_file"
            echo "Expected exit status 0 or 10, got ${status}: $*" >&2
            return 1
          }

          ./wsl-fedora-guest-tools --help >/dev/null
          ./wsl-fedora-guest-tools --list-tools >/dev/null
          ./wsl-fedora-guest-tools --dry-run --profile core >/dev/null
          ./wsl-fedora-guest-tools --dry-run --profile all --skip volta,uv.self,uv.tools,gh,claude,codex >/dev/null
          ./wsl-fedora-guest-tools --dry-run --only dnf --skip dnf >/dev/null
          expect_success_or_exit_10 ./wsl-fedora-guest-tools --dry-run --only uv.self
          expect_success_or_exit_10 ./wsl-fedora-guest-tools --dry-run --only uv.tools
          expect_success_or_exit_10 ./wsl-fedora-guest-tools --dry-run --only gh

  notify-scheduled-failure:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [quality, fedora_smoke]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create/update issue when scheduled run fails, close when healthy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Scheduled CI failure detected";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const results = {
              quality: "${{ needs.quality.result }}",
              fedora_smoke: "${{ needs.fedora_smoke.result }}"
            };
            const failed = Object.values(results).some((result) => result !== "success");
            const resultSummary = Object.entries(results)
              .map(([job, result]) => `- **${job}:** ${result}`)
              .join("\n");
            const body = [
              "A scheduled CI run failed. This is an automated alert to indicate dependencies/workflows may need updates.",
              "One or more matrix legs may have failed.",
              "",
              `- **Workflow:** ${context.workflow}`,
              `- **Run number:** ${context.runNumber}`,
              `- **Commit:** ${context.sha}`,
              `- **Run:** ${runUrl}`,
              `- **Triggered at:** ${new Date().toISOString()}`,
              "",
              "Job results:",
              resultSummary,
              "",
              "Use the run URL above as the canonical triage source to identify failing job(s)/matrix leg(s).",
              "This issue will be auto-closed by the next successful scheduled run."
            ].join("\n");

            try {
              await github.rest.issues.getLabel({ owner, repo, name: "ci-scheduled" });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: "ci-scheduled", color: "d93f0b", description: "Automated scheduled CI failure alerts" });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "ci-scheduled",
              per_page: 100
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["ci-scheduled"]
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Scheduled CI run recovered: ${runUrl}`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed"
              });
            }
