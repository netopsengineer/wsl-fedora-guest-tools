---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday run at 07:13 UTC to catch upstream breakage economically.
    - cron: "13 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality-and-smoke:
    name: shell-quality-and-smoke (${{ matrix.fedora_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora_image: fedora:43
            fedora_label: fedora43
            dnf_tooling: dnf5
            assert_non_dnf5: false
          - fedora_image: fedora:39
            fedora_label: fedora39
            dnf_tooling: dnf-plugins-core
            assert_non_dnf5: true
    container:
      image: ${{ matrix.fedora_image }}
    timeout-minutes: 20

    steps:
      - name: Install git
        run: dnf -y install git

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tooling
        run: dnf -y install sudo shellcheck shfmt util-linux ${{ matrix.dnf_tooling }}

      - name: Syntax check
        run: bash -n wsl-fedora-guest-tools.sh

      - name: ShellCheck
        run: shellcheck wsl-fedora-guest-tools.sh

      - name: Format check
        run: shfmt -d wsl-fedora-guest-tools.sh

      - name: Smoke checks
        if: ${{ !matrix.assert_non_dnf5 }}
        run: |
          ./wsl-fedora-guest-tools.sh --help >/dev/null
          ./wsl-fedora-guest-tools.sh --list-tools >/dev/null
          ./wsl-fedora-guest-tools.sh --dry-run --profile core >/dev/null
          ./wsl-fedora-guest-tools.sh --dry-run --profile all --skip volta,uv,claude,codex >/dev/null
          ./wsl-fedora-guest-tools.sh --dry-run --only dnf --skip dnf >/dev/null

      - name: Ensure non-dnf5 test preconditions
        if: ${{ matrix.assert_non_dnf5 }}
        run: |
          rm -f /etc/yum.repos.d/gh-cli.repo
          dnf -y remove gh || true
          if command -v dnf5 >/dev/null 2>&1; then
            echo "dnf5 is present; this job must exercise the non-dnf5 path." >&2
            exit 1
          fi

      - name: Exercise non-dnf5 dry-run path
        if: ${{ matrix.assert_non_dnf5 }}
        run: |
          out="$(./wsl-fedora-guest-tools.sh --dry-run --profile core)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "DNF backend selected: dnf"
          printf '%s\n' "$out" | grep -F "DRY-RUN: sudo dnf --refresh upgrade -y"
          printf '%s\n' "$out" | grep -F "DRY-RUN: sudo dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo"
          printf '%s\n' "$out" | grep -F "DRY-RUN: sudo dnf install -y gh --enablerepo=gh-cli"

  notify-scheduled-failure:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [shell-quality-and-smoke]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create/update issue when scheduled run fails, close when healthy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Scheduled CI failure detected";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = "${{ needs.shell-quality-and-smoke.result }}";
            const failed = result !== "success";
            const body = [
              "A scheduled CI run failed. This is an automated alert to indicate dependencies/workflows may need updates.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Result: ${result}`,
              `- Run: ${runUrl}`,
              `- Triggered at: ${new Date().toISOString()}`,
              "",
              "This issue will be auto-closed by the next successful scheduled run."
            ].join("\n");

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Scheduled CI run recovered: ${runUrl}`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed"
              });
            }
