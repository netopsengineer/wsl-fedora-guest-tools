---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly Monday run at 07:13 UTC to catch upstream breakage economically.
    - cron: "13 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-quality-and-smoke:
    name: shell-quality-and-smoke (${{ matrix.fedora_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora_image: "fedora:43"
            fedora_label: fedora43
          - fedora_image: "fedora:42"
            fedora_label: fedora42
    container:
      image: ${{ matrix.fedora_image }}
    timeout-minutes: 10

    steps:
      - name: Install git
        run: dnf install -y git

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tooling
        run: dnf install -y sudo shellcheck shfmt util-linux

      - name: Syntax check
        run: bash -n wsl-fedora-guest-tools

      - name: ShellCheck
        run: shellcheck wsl-fedora-guest-tools

      - name: Format check
        run: shfmt -d wsl-fedora-guest-tools

      - name: AGENTS.md size check
        run: '[[ $(wc -c < AGENTS.md) -le 32768 ]] || { echo "AGENTS.md exceeds 32 KiB: $(wc -c < AGENTS.md) bytes"; exit 1; }'

      - name: Smoke checks
        run: |
          ./wsl-fedora-guest-tools --help >/dev/null
          ./wsl-fedora-guest-tools --list-tools >/dev/null
          ./wsl-fedora-guest-tools --dry-run --profile core >/dev/null
          ./wsl-fedora-guest-tools --dry-run --profile all --skip volta,uv.self,uv.tools,gh,claude,codex >/dev/null
          ./wsl-fedora-guest-tools --dry-run --only dnf --skip dnf >/dev/null
          ./wsl-fedora-guest-tools --dry-run --only uv.self >/dev/null || [[ $? -eq 10 ]]
          ./wsl-fedora-guest-tools --dry-run --only uv.tools >/dev/null || [[ $? -eq 10 ]]
          ./wsl-fedora-guest-tools --dry-run --only gh >/dev/null || [[ $? -eq 10 ]]

  notify-scheduled-failure:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [shell-quality-and-smoke]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Create/update issue when scheduled run fails, close when healthy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Scheduled CI failure detected";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = "${{ needs.shell-quality-and-smoke.result }}";
            const failed = result !== "success";
            const body = [
              "A scheduled CI run failed. This is an automated alert to indicate dependencies/workflows may need updates.",
              "One or more matrix legs may have failed.",
              "",
              `- **Workflow:** ${context.workflow}`,
              `- **Result:** ${result}`,
              `- **Run number:** ${context.runNumber}`,
              `- **Commit:** ${context.sha}`,
              `- **Run:** ${runUrl}`,
              `- **Triggered at:** ${new Date().toISOString()}`,
              "",
              "Use the run URL above as the canonical triage source to identify failing job(s)/matrix leg(s).",
              "This issue will be auto-closed by the next successful scheduled run."
            ].join("\n");

            try {
              await github.rest.issues.getLabel({ owner, repo, name: "ci-scheduled" });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: "ci-scheduled", color: "d93f0b", description: "Automated scheduled CI failure alerts" });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "ci-scheduled",
              per_page: 100
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ["ci-scheduled"]
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Scheduled CI run recovered: ${runUrl}`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed"
              });
            }
