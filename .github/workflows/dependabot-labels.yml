---
name: Dependabot labels

on:
  # pull_request_target is required here because Dependabot PRs receive a
  # read-only token on pull_request, which cannot create missing labels.
  # zizmor: ignore[dangerous-triggers]
  # This workflow never checks out or executes pull request code.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ensure-dependabot-labels:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Dependabot labels exist and are applied
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const getErrorStatus = (error) => error.status ?? error.response?.status;
            const pullRequestNumber = context.payload.pull_request?.number;
            const requiredLabels = [
              {
                name: "dependencies",
                color: "0366d6",
                description: "Dependency updates and maintenance"
              },
              {
                name: "github-actions",
                color: "2088ff",
                description: "GitHub Actions workflow dependency updates"
              },
              {
                name: "npm",
                color: "cb3837",
                description: "npm development tooling updates"
              },
              {
                name: "pre-commit",
                color: "f3d34a",
                description: "pre-commit hook dependency updates"
              }
            ];

            for (const label of requiredLabels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                const status = getErrorStatus(error);

                if (status === 422) {
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  console.error(`Failed to reconcile label ${label.name} (status: ${status ?? "unknown"}):`, error);
                  throw error;
                }
              }
            }

            if (pullRequestNumber) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullRequestNumber,
                per_page: 100
              });
              const filenames = files.map((file) => file.filename);
              const labelsToApply = new Set(["dependencies"]);

              if (filenames.some((name) => name.startsWith(".github/workflows/") || name.startsWith(".github/actions/"))) {
                labelsToApply.add("github-actions");
              }

              if (filenames.some((name) => name === "package.json" || name === "package-lock.json")) {
                labelsToApply.add("npm");
              }

              if (filenames.some((name) => name === ".pre-commit-config.yaml" || name === ".pre-commit-config.yml")) {
                labelsToApply.add("pre-commit");
              }

              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequestNumber,
                  labels: [...labelsToApply]
                });
              } catch (error) {
                const status = getErrorStatus(error);
                console.error(`Failed to apply Dependabot labels (status: ${status ?? "unknown"}):`, error);
                throw error;
              }
            }
