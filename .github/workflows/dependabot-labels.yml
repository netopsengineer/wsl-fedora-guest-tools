---
name: Dependabot labels

on:
  # pull_request_target is required here because Dependabot PRs receive a
  # read-only token on pull_request, which cannot create missing labels.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-dependabot-labels:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Dependabot labels exist and are applied
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requiredLabels = [
              {
                name: "ci",
                color: "1d76db",
                description: "Continuous integration and workflow updates"
              },
              {
                name: "dependencies",
                color: "0366d6",
                description: "Dependency updates and maintenance"
              }
            ];

            for (const label of requiredLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name
                });

                if (
                  existing.color.toLowerCase() !== label.color.toLowerCase() ||
                  (existing.description || "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                }
              } catch (error) {
                const status = error.status ?? error.response?.status;

                if (status !== 404) {
                  console.error(`Failed to inspect label ${label.name} (status: ${status ?? "unknown"}):`, error);
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            if (context.payload.pull_request) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: context.payload.pull_request.number,
                labels: requiredLabels.map((label) => label.name)
              });
            }
