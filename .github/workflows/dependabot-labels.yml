---
name: Dependabot labels

on:
  # pull_request_target is required here because Dependabot PRs receive a
  # read-only token on pull_request, which cannot create missing labels.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-dependabot-labels:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Dependabot labels exist and are applied
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const getErrorStatus = (error) => error.status ?? error.response?.status;
            const pullRequestNumber = context.payload.pull_request?.number;
            const requiredLabels = [
              {
                name: "ci",
                color: "1d76db",
                description: "Continuous integration and workflow updates"
              },
              {
                name: "dependencies",
                color: "0366d6",
                description: "Dependency updates and maintenance"
              }
            ];

            for (const label of requiredLabels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                const status = getErrorStatus(error);

                if (status === 422) {
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  console.error(`Failed to reconcile label ${label.name} (status: ${status ?? "unknown"}):`, error);
                  throw error;
                }
              }
            }

            if (pullRequestNumber) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequestNumber,
                  labels: requiredLabels.map((label) => label.name)
                });
              } catch (error) {
                const status = getErrorStatus(error);
                console.error(`Failed to apply Dependabot labels (status: ${status ?? "unknown"}):`, error);
                throw error;
              }
            }
